services:

  postgres:
    image: postgres:16
    container_name: microservices-postgres-job-portal
    restart: unless-stopped

    environment:
      POSTGRES_USER: samrit
      POSTGRES_PASSWORD: root
#      POSTGRES_DB: user_db


    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
