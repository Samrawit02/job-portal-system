
server:
  port: 8888

spring:
  application:
    name: job-portal-config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Samrawit02/job-portal-config.git
          clone-on-start: true
          default-label: master


eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/
