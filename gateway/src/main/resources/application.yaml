server:
  port: 5000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: job-portal-user-service
              uri: lb://JOB-PORTAL-USER-SERVICE
              predicates:
                  - Path=/auth/**, /users/**, /api/users/**

            - id: job-portal-company-service
              uri: lb://JOB-PORTAL-COMPANY-SERVICE
              predicates:
                - Path=/api/companies/**

            - id: job-portal-job-service
              uri: lb://JOB-PORTAL-JOB-SERVICE
              predicates:
                - Path=/api/jobs/**, /api/job-categories, /api/job-skills , /api/job-tags

            - id: ob-portal-resume-service
              uri: lb://JOB-PORTAL-JOB-SERVICE
              predicates:
                - Path=/api/jobs/**, /api/job-categories, /api/job-skills , /api/job-tags

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
            '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web: DEBUG